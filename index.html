<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FlashPad · 瞬笺</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="paper relative flex min-h-0 min-w-0 flex-col" aria-label="瞬笺">
      <header class="titlebar relative shrink-0" data-tauri-drag-region>
        <div class="window-actions absolute flex items-center gap-1">
          <button id="pin" class="icon-button" type="button" aria-label="窗口置顶" aria-pressed="false" title="窗口置顶">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 12 12-2 2-4-1-3 3-7-7 3-3-1-4 2-2Zm-.5 12.5L3 21"/></svg>
          </button>
          <button id="hide" class="icon-button" type="button" aria-label="隐藏窗口" title="隐藏窗口（Esc）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>
      <div class="editor-frame flex min-h-0 flex-1 justify-center">
        <textarea id="editor" aria-label="临时草稿" placeholder="写点什么…" wrap="soft" spellcheck="false" autocomplete="off" autofocus></textarea>
      </div>
      <div id="feedback" class="feedback absolute" role="status" aria-live="polite"></div>
      <footer class="footer absolute flex items-end justify-center" aria-label="草稿工具">
        <div class="capsule flex items-center">
          <span id="word-count" class="word-count">0 字</span>
          <span class="capsule-divider" aria-hidden="true"></span>
          <button id="cleanup" class="icon-button" type="button" aria-label="清理多余空行" title="清理多余空行">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16m-3-6h3"/></svg>
          </button>
          <button id="history" class="icon-button" type="button" aria-label="恢复上一条草稿" title="恢复上一条草稿">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 1 2.6 6.4M3 6v6h6m3-4v4l3 2"/></svg>
          </button>
          <button id="theme" class="icon-button" type="button" aria-label="深色模式" aria-pressed="false" title="切换明暗主题">
            <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3A9 9 0 0 1 10.7 3.1 9 9 0 1 0 21 13.3Z"/></svg>
            <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>
          </button>
          <button id="copy" class="icon-button copy-button" type="button" aria-label="复制并清空" title="复制并清空">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          </button>
        </div>
      </footer>
    </main>
  </body>
</html>
